plugins:
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - tmp/**/*
    - vendor/**/*

Layout/LineLength:
  Max: 130

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Minitest/MultipleAssertions:
  Enabled: false

Style/SymbolProc:
  AllowedMethods:
    - lambda
